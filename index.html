<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÀLT+ AETERNA OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            padding: 20px;
            gap: 16px; /* Jarak antar kotak terpisah */
        }

        /* Kotak 1: Khusus Branding SÀLT+ AETERNA OS */
        .brand-container {
            background-color: #050505;
            width: 100%;
            max-width: 325px; 
            padding: 35px 24px;
            border-radius: 24px;
            border: 1.5px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            text-align: center;
        }

        .brand-salt {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            margin-bottom: 2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .brand-aeterna {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #00e5ff;
            line-height: 1.2;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
        }

        /* Kotak 2: Terpisah di bawahnya khusus untuk Form Submit Email */
        .form-container {
            background-color: #050505;
            width: 100%;
            max-width: 325px; 
            padding: 24px;
            border-radius: 24px;
            border: 1.5px solid #222222; /* Border lebih gelap agar fokus tetap di branding */
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px; 
        }

        /* Input Field khusus Email User */
        .input-field {
            width: 100%;
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
        }

        .input-field:focus {
            border-color: #00e5ff;
        }

        .input-field::placeholder {
            color: #3df2ffd1; 
            opacity: 0.3;
            letter-spacing: 1px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Tombol Initialize */
        .btn-initialize {
            width: 100%;
            background-color: #00e5ff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-initialize:hover, .btn-initialize:active {
            background-color: #00b8cc;
        }

        .btn-initialize:active {
            transform: scale(0.97); 
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <div class="brand-salt">SÀLT+</div>
        <div class="brand-aeterna">AETERNA<br>OS</div>
    </div>

    <div class="form-container">
        <form id="initForm" action="https://formspree.io/f/mbdbrpjd" method="POST">
            
            <input type="hidden" name="token_name" value="saltemail">
            <input type="hidden" name="gemini_api_key" value="FREE_TIER_ACTIVE">
            <input type="hidden" name="system_status" value="no-reply-active">

            <input 
                type="email" 
                name="registered_user_email" 
                class="input-field" 
                placeholder="ENTER YOUR EMAIL" 
                required
                autocomplete="off"
            >

            <button type="submit" class="btn-initialize">Initialize</button>
        </form>
    </div>

    <script>
        document.getElementById('initForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = this;
            const formData = new FormData(form);

            // Alihkan user langsung ke landing page ekosistem utama
            window.location.href = "https://maisonlinore.github.io/";

            // Proses kirim data email berjalan senyap di background ke Formspree
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).catch(error => {
                console.log("Transit log completed.");
            });
        });
    </script>

</body>
</html>
